<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index1.css">
</head>
<body>


    <div class="main">

        <div class="left">

            <div class="card" id="card1">

                <img src="card-logo.svg" class="deck1">

                <h3 id="card_number">e.g. Jane Appleseed</h3>

                <h4 class="mini"  id="name">e.g. 1234 5678 9123 0000</h4>

                <h4 class="mini" id="datayher">MM/YY</h4>

            </div>



            <div class="card" id="card2">

                <h4 class="mini" id="cvc">e.g. 123</h4>

            </div>
            


        </div>



        <div class="right">

            <div id="start">

                <h4 class="hed">Cardholder Name <br><br><span id="namespan"></span></h4>

                <input type="text" placeholder="e.g. Jane Appleseed" id="nameinput"><br>


                <h4 class="hed">Card Number <br><br><span id="cardnumberspan"></span></h4>

                <input type="number" placeholder="e.g. 1234 5678 9123 0000" id="cardinput"><br>


                <h4 class="hed">Exp. Date (MM/YY) CVC <br><br><span id="mmspan"></span><br> <span id="yyspan"></span> <br><span id="cvcspan"></span></h4>

                <div class="deck2">

                    <input type="number" placeholder="MM" id="mm">

                    <input type="number" placeholder="YY" id="yy">

                    <input type="number" placeholder="e.g. 123" id="cvcinput">

                </div><br><br><br>



                <button id="submit1">Confirm</button>

            </div>


            <div id="done" style="display: none;">

                <img src="icon-complete.svg" >

                <h1>Thank you!</h1>

                <p class="thank_you">We've added your card details</p>

                <button id="submit2">Continue</button>

            </div>


        </div>


    </div>






    <script src="index1.js"></script>
    
</body>
</html>
